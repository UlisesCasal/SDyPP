name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - desarrollo
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  ci-build-and-test:
    name: Continuous Integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies
        working-directory: trabajopractico
        run: ./mvnw -B -ntp dependency:resolve

      - name: Build and test
        working-directory: trabajopractico
        run: ./mvnw -B -ntp clean verify

  cd-deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package artifact
        working-directory: trabajopractico
        run: ./mvnw -B -ntp clean package -DskipTests

      - name: Simulate deployment
        run: |
          echo "🚀 Deploying Spring Boot application to production..."
          echo "✅ Deployment successful!"
